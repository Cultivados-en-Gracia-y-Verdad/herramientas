<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finite Verbs</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main>
      <div class="controls">
        <div class="view-switch" aria-label="Viewer">
          <button class="switch-button active" id="verbs-view-button" type="button">
            Finite verbs
          </button>
          <button class="switch-button" id="assertions-view-button" type="button">
            Assertions
          </button>
        </div>

        <div class="filters" aria-label="Viewer filters">
          <label>
            Chapter
            <select id="chapter-filter">
              <option value="">All</option>
            </select>
          </label>

          <label>
            Mood
            <select id="mood-filter">
              <option value="">All</option>
            </select>
          </label>

          <div class="assertion-actions" id="assertion-actions" hidden>
            <div class="passage-scope">Eph 1:4–14</div>
            <div class="mode-switch" aria-label="Assertion display">
              <button class="mode-button active" id="full-view-button" type="button">
                Full
              </button>
              <button class="mode-button" id="compressed-view-button" type="button">
                Compressed
              </button>
            </div>
            <button class="file-button" id="save-json-button" type="button">
              Save JSON
            </button>
            <label class="file-button load-button">
              Load JSON
              <input id="load-json-input" type="file" accept=".json,application/json" />
            </label>
          </div>

          <output id="count" aria-live="polite"></output>
        </div>
      </div>

      <div id="verbs-view">
        <ol id="verb-path" class="verb-path" aria-label="Ordered finite-verb path"></ol>
      </div>

      <div id="assertions-view" hidden>
        <div class="observation-session">
          <div class="observation-title">Observation Session</div>
          <div class="observation-checks">
            <label class="observation-check">
              <input id="subjects-complete" type="checkbox" />
              Subjects complete
            </label>
            <label class="observation-check">
              <input id="objects-complete" type="checkbox" />
              Objects complete
            </label>
            <label class="observation-check">
              <input id="compressed-observed" type="checkbox" />
              Observed compressed view
            </label>
          </div>
          <label class="observation-notes-label" for="observation-notes">
            Notes:
          </label>
          <textarea id="observation-notes" class="observation-notes" rows="3"></textarea>
        </div>

        <div class="assertion-table-wrap" id="assertion-table-wrap">
          <table class="assertion-table">
            <thead>
              <tr>
                <th>Subject</th>
                <th>Verb</th>
                <th>Object</th>
                <th>Ref</th>
                <th>RMAC</th>
              </tr>
            </thead>
            <tbody id="assertion-table-body"></tbody>
          </table>
        </div>
        <div class="compressed-assertions" id="compressed-assertions" hidden></div>
      </div>

      <p id="message" class="message" aria-live="polite">Loading…</p>
      <output id="save-status" class="save-status" aria-live="polite"></output>
    </main>

    <div class="rmac-popover" id="rmac-popover" role="dialog" aria-modal="false" hidden>
      <div class="rmac-popover-header">
        <code id="rmac-popover-code"></code>
        <button id="rmac-popover-close" type="button" aria-label="Cerrar ayuda RMAC">×</button>
      </div>
      <dl id="rmac-popover-details"></dl>
    </div>

    <div
      class="interlinear-popover"
      id="interlinear-popover"
      role="dialog"
      aria-modal="false"
      aria-labelledby="interlinear-popover-ref"
      hidden
    >
      <div class="interlinear-popover-header">
        <div>
          <div class="interlinear-popover-label">Interlineal</div>
          <div id="interlinear-popover-ref"></div>
        </div>
        <button
          id="interlinear-popover-close"
          type="button"
          aria-label="Cerrar interlineal"
        >
          ×
        </button>
      </div>
      <div class="interlinear-verse-wrap">
        <div
          class="interlinear-verse"
          id="interlinear-popover-body"
          aria-label="Texto interlineal del versículo"
        ></div>
      </div>
    </div>

    <script src="output/finite_verbs_data.js"></script>
    <script src="output/assertions_data.js"></script>
    <script src="output/interlinear_data.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
