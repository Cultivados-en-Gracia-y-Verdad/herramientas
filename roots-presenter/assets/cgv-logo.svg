<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CGV Logo</title>
  <desc id="desc">CGV logo with navy house outline, green potted plant, and CGV lettering on white background.</desc>

  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- Colors -->
  <defs>
    <style>
      .navy { fill: #0b174d; }
      .green { fill: #7fbd35; }
      .lightgreen { fill: #b6df4f; }
      .letters {
        font-family: Arial Black, Arial, Helvetica, sans-serif;
        font-weight: 900;
        font-size: 205px;
        letter-spacing: -14px;
      }
    </style>
  </defs>

  <!-- House outline, built as thick strokes -->
  <g stroke="#0b174d" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M130 300 L512 78 L894 300"/>
    <path d="M185 275 V612 H350"/>
    <path d="M839 275 V612 H674"/>
  </g>

  <!-- Lower feet of house -->
  <path class="navy" d="M185 612 H350 L368 646 H185 Z"/>
  <path class="navy" d="M674 612 H839 V646 H656 Z"/>

  <!-- Plant pot -->
  <path class="green" d="M382 547 L430 547 L440 590 Q512 566 584 590 L594 547 L642 547 L610 680 H414 Z"/>
  <path class="green" d="M397 555 L380 495 Q377 482 390 479 L414 473 Q426 470 429 483 L443 535 Z"/>
  <path class="green" d="M627 555 L644 495 Q647 482 634 479 L610 473 Q598 470 595 483 L581 535 Z"/>

  <!-- Stem -->
  <path class="green" d="M504 585 C512 515 535 455 578 405 C590 391 611 408 600 424 C565 472 552 525 544 590 Z"/>

  <!-- Leaves -->
  <path class="green" d="M510 421 C435 420 379 370 365 302 C435 287 499 332 510 421 Z"/>
  <path class="green" d="M555 436 C632 430 679 367 674 301 C604 304 557 360 555 436 Z"/>
  <path class="lightgreen" d="M517 294 C555 267 569 224 560 188 C522 200 499 238 517 294 Z"/>

  <!-- CGV text -->
  <text x="66" y="886" class="letters green">C</text>
  <text x="356" y="886" class="letters navy">G</text>
  <text x="637" y="886" class="letters navy">V</text>
</svg>
