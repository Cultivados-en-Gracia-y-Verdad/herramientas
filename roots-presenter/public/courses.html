<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="downloadCourses">Download Courses</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="courses.css">
</head>
<body>
  <header>
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span data-i18n="downloadCourses">Download Courses</span>
      </div>
    </div>
  </header>

  <main>
    <section>
      <h2 data-i18n="cgvRepository">CGV Repository</h2>
      <div class="button-row">
        <button id="refreshCatalogButton" type="button" data-i18n="refreshCourses">Refresh Courses</button>
      </div>
      <p id="repositoryStatus" data-i18n="downloadedCoursesDefault">Downloaded courses are installed to your local CGV Presenter library.</p>
      <div id="courseList" class="course-list"></div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="courses.js"></script>
</body>
</html>
