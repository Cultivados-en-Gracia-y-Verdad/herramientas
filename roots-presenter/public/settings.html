<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="appSettings">Settings</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span data-i18n="appSettings">Settings</span>
      </div>
    </div>
    <button id="saveButton" type="button" data-i18n="saveSettings">Save Settings</button>
  </header>

  <section class="settings-panel language-panel">
    <div>
      <h2 data-i18n="language">Language</h2>
      <p data-i18n="languageHelp">Choose the application language for menus, controls, and teaching screens.</p>
    </div>
    <label>
      <span data-i18n="appLanguage">App language</span>
      <select id="languageSelect">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>
  </section>

  <section class="theme-panel">
    <div class="theme-panel-copy">
      <h2 data-i18n="themes">Themes</h2>
      <p data-i18n="themesHelp">Apply a built-in or custom theme, then save the current settings under a new name.</p>
    </div>
    <div class="theme-controls">
      <label>
        <span data-i18n="currentTheme">Current theme</span>
        <select id="themeSelect"></select>
      </label>
      <button id="applyThemeButton" type="button" data-i18n="applyTheme">Apply Theme</button>
      <label>
        <span data-i18n="newThemeName">New theme name</span>
        <input id="themeNameInput" type="text" placeholder="Example: Filipenses Night" data-i18n-placeholder="themeNamePlaceholder">
      </label>
      <button id="saveThemeButton" type="button" data-i18n="saveCurrentAsTheme">Save Current as Theme</button>
    </div>
  </section>

  <main id="settingsForm"></main>

  <footer>
    <span id="statusText" data-i18n="settingsFooter">Changes apply to main, presenter, and audience views.</span>
  </footer>

  <script src="i18n.js"></script>
  <script src="themes.js"></script>
  <script src="settings.js"></script>
</body>
</html>
