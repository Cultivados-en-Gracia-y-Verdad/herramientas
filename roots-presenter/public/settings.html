<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span>Settings</span>
      </div>
    </div>
    <button id="saveButton" type="button">Save Settings</button>
  </header>

  <section class="settings-panel language-panel">
    <div>
      <h2>Language</h2>
      <p>Choose the application language for menus, controls, and teaching screens.</p>
    </div>
    <label>
      App language
      <select id="languageSelect">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>
  </section>

  <section class="theme-panel">
    <div class="theme-panel-copy">
      <h2>Themes</h2>
      <p>Apply a built-in or custom theme, then save the current settings under a new name.</p>
    </div>
    <div class="theme-controls">
      <label>
        Current theme
        <select id="themeSelect"></select>
      </label>
      <button id="applyThemeButton" type="button">Apply Theme</button>
      <label>
        New theme name
        <input id="themeNameInput" type="text" placeholder="Example: Filipenses Night">
      </label>
      <button id="saveThemeButton" type="button">Save Current as Theme</button>
    </div>
  </section>

  <main id="settingsForm"></main>

  <footer>
    <span id="statusText">Changes apply to main, presenter, and audience views.</span>
  </footer>

  <script src="themes.js"></script>
  <script src="settings.js"></script>
</body>
</html>
