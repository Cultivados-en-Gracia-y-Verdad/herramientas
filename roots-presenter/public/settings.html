<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Style Settings</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span>Style Settings</span>
      </div>
    </div>
    <div class="settings-actions">
      <label class="theme-picker">
        Theme
        <select id="themeSelect"></select>
      </label>
      <button id="applyThemeButton" type="button">Apply Theme</button>
      <button id="saveButton" type="button">Save</button>
    </div>
  </header>

  <main id="settingsForm"></main>

  <footer>
    <span id="statusText">Changes apply to main, presenter, and audience views.</span>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
