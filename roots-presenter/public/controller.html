<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="controller">Controller</title>
  <link rel="icon" href="/assets/cgv-app-icon.png">
  <link rel="stylesheet" href="controller.css">
</head>
<body>
  <header class="controller-topbar">
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span data-i18n="controllerView">Controller View</span>
      </div>
    </div>
    <div id="liveStatus" class="live-status" data-i18n="projectorTeachingMode">Projector: teaching mode</div>
  </header>

  <main class="controller-shell">
    <section class="song-library">
      <div class="section-heading">
        <div>
          <h1 data-i18n="songs">Songs</h1>
          <p data-i18n="songsHelp">Select a song, then send it live.</p>
        </div>
        <button id="newSongButton" type="button" class="secondary" data-i18n="newSong">New Song</button>
      </div>

      <label class="search-field">
        <span data-i18n="searchSongs">Search songs</span>
        <input id="songSearch" type="search" placeholder="Type a title or lyric..." data-i18n-placeholder="searchSongsPlaceholder">
      </label>

      <div id="songList" class="song-list"></div>
    </section>

    <section id="songEditor" class="song-editor hidden">
      <div class="section-heading">
        <div>
          <h1 data-i18n="editSong">Edit Song</h1>
          <p data-i18n="editSongHelp">Blank lines create separate screens/stanzas.</p>
        </div>
        <button id="closeEditorButton" type="button" class="secondary" data-i18n="close">Close</button>
      </div>

      <label>
        <span data-i18n="title">Title</span>
        <input id="songTitle" type="text" placeholder="Song title" data-i18n-placeholder="songTitlePlaceholder">
      </label>

      <label>
        <span data-i18n="lyricsAndChords">Lyrics and chords</span>
        <textarea id="songLyrics" spellcheck="false" placeholder="[D]Verse 1 line 1&#10;Verse 1 [G]line 2&#10;&#10;[A]Chorus line 1&#10;Chorus [D]line 2"></textarea>
      </label>

      <label>
        <span data-i18n="songBackgroundImage">Song background image</span>
        <select id="songBackgroundMedia"></select>
      </label>

      <div class="button-row compact-row">
        <button id="importSongBackgroundButton" type="button" class="secondary" data-i18n="importBackgroundImage">Import image</button>
        <input id="songBackgroundFile" class="hidden-file" type="file" accept="image/*,video/*">
      </div>

      <div class="button-row">
        <button id="saveSongButton" type="button" data-i18n="saveSong">Save Song</button>
        <button id="cancelEditorButton" type="button" class="secondary" data-i18n="cancel">Cancel</button>
      </div>
    </section>

    <aside class="controller-panel">
      <section class="panel-card course-sections-card">
        <h2 data-i18n="courseSections">Course Sections</h2>
        <div id="courseSections" class="course-sections"></div>
      </section>

      <section class="panel-card">
        <h2 data-i18n="liveOutput">Live Output</h2>
        <div class="button-row">
          <button id="goLiveButton" type="button" data-i18n="sendLive">Send Live</button>
          <button id="clearButton" type="button" class="secondary" data-i18n="returnToTeaching">Return to Teaching</button>
        </div>
        <button id="blankButton" type="button" class="secondary full" data-i18n="blankScreen">Blank Screen</button>
        <div class="button-row">
          <button id="previousButton" type="button" class="secondary" data-i18n="previous">Previous</button>
          <button id="nextButton" type="button" class="secondary" data-i18n="next">Next</button>
        </div>
      </section>

      <section class="panel-card">
        <details id="backgroundControls" class="background-controls">
          <summary data-i18n="backgroundStyle">Background Style</summary>
          <input id="backgroundMedia" type="hidden">
          <div id="backgroundGallery" class="background-gallery"></div>
          <button id="clearBackgroundButton" type="button" class="secondary full" data-i18n="clearBackgroundImage">Clear Background Image</button>
          <div class="color-grid">
            <label>
              <span data-i18n="background">Background</span>
              <input id="backgroundColor" type="color" value="#0f172a">
            </label>
            <label>
              <span data-i18n="text">Text</span>
              <input id="textColor" type="color" value="#ffffff">
            </label>
            <label>
              <span data-i18n="accent">Accent</span>
              <input id="accentColor" type="color" value="#38bdf8">
            </label>
          </div>
          <button id="applyStyleButton" type="button" class="secondary full" data-i18n="applyStyle">Apply Style</button>
        </details>
      </section>

      <section class="panel-card preview-card">
        <div class="preview-heading">
          <h2 data-i18n="preview">Preview</h2>
          <button id="toggleBackgroundButton" type="button" class="secondary" data-i18n="style">Style</button>
        </div>
        <div id="controllerPreview" class="controller-preview"></div>
        <div id="songThumbnails" class="song-thumbnails"></div>
      </section>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="controller.js"></script>
</body>
</html>
