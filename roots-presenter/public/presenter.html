<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Presenter</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style-settings.css">
</head>
<body class="presenter">
  <div class="topbar">
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span>Presenter View</span>
      </div>
    </div>
    <button onclick="reloadSlides()">Reload Slides</button>
  </div>

  <main class="grid">
    <section>
      <h2>Current</h2>
      <div id="current" class="slide"></div>
    </section>

    <section>
      <h2>Next</h2>
      <div id="next" class="slide next"></div>
    </section>
  </main>

  <footer>
    <button onclick="prev()">← Prev</button>
    <button onclick="next()">Next →</button>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
