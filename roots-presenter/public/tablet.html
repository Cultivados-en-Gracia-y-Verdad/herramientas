<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Tablet Drawing</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style-settings.css">
</head>
<body class="projector tablet">
  <div class="tablet-toolbar">
    <button type="button" class="active" onclick="setDrawingMode('pen')">Pen</button>
    <button type="button" onclick="setDrawingMode('eraser')">Eraser</button>
    <button type="button" onclick="clearDrawing()">Clear</button>
  </div>

  <div class="tablet-viewport">
    <div class="tablet-scale-root">
      <div class="projector-frame">
        <div id="projectorSlide" class="projector-slide"></div>
        <canvas id="projectorCanvas" class="drawing-canvas"></canvas>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
