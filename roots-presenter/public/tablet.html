<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tablet Drawing</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style-settings.css">
  <link rel="stylesheet" href="tablet.css">
</head>
<body class="tablet">
  <div class="tablet-toolbar">
    <div class="tablet-title">Tablet Drawing</div>
    <div class="tablet-actions">
      <button id="tabletPrevButton" type="button">Previous</button>
      <button id="tabletNextButton" type="button">Next</button>
      <button id="tabletBlankButton" type="button">Blank</button>
      <button id="tabletClearButton" type="button">Clear</button>
    </div>
  </div>

  <div class="tablet-stage" id="tabletStage">
    <iframe id="tabletProjectorPreview" src="/projector.html" title="Projector preview"></iframe>
    <div id="tabletBlankSurface" aria-hidden="true"></div>
    <canvas id="tabletDrawingCanvas"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="tablet.js"></script>
</body>
</html>
