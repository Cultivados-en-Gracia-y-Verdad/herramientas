[package]
name = "cgv-writer"
version = "0.1.0"
description = "CGV Writer"
authors = ["CGV"]
edition = "2021"

[lib]
name = "cgv_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
