name: Apply Daniel bronce migration

on:
  push:
    branches:
      - agent/canonical-book-workflow
    paths:
      - .github/workflows/apply-daniel-bronce.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-book-workflow
          fetch-depth: 0
      - name: Apply canonical Daniel terminology migration
        working-directory: cgv-translator
        run: |
          python3 scripts/book_lexical_edit.py \
            --book daniel \
            --reference "Daniel 2:39" \
            --source-surface "נחשא" \
            --from metal \
            --to bronce \
            --apply
      - name: Verify terminology and alignment structure
        working-directory: cgv-translator
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from scripts.workflow_queues import alignment_errors

          base = Path('translations/oshb-spine/daniel')
          phrases = json.loads((base / 'daniel-phrases.json').read_text(encoding='utf-8'))
          spine = json.loads((base / 'daniel-oshb-spine.json').read_text(encoding='utf-8'))
          reverse = json.loads((base / 'daniel-reverse-links.json').read_text(encoding='utf-8'))
          rows = phrases['phrases']
          metal = sum(len(re.findall(r'(?<!\\w)metal(?!\\w)', str(row.get('spanish') or ''))) for row in rows)
          bronce = sum(len(re.findall(r'(?<!\\w)bronce(?!\\w)', str(row.get('spanish') or ''))) for row in rows)
          assert metal == 0, f'remaining Spanish metal occurrences: {metal}'
          assert bronce == 10, f'expected 10 Spanish bronce occurrences, found {bronce}'
          errors = alignment_errors('daniel', spine, phrases, reverse)
          assert not errors, '\n'.join(errors[:20])
          print('Daniel terminology: 0 metal, 10 bronce')
          print('Daniel alignment structure: PASS')
          PY
      - name: Commit migrated Daniel artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cgv-translator/translations/oshb-spine/daniel/daniel-phrases.json \
            cgv-translator/translations/oshb-spine/daniel/daniel-reverse-links.json \
            cgv-translator/workflow/daniel/lexical-edits.jsonl
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "apply Daniel bronce terminology"
          git push origin HEAD:agent/canonical-book-workflow
