- id: G0A-0001
  reference: Daniel 10:6
  decision: APPROVED
  confidence: medium
  evidence: 'כְ/תַרְשִׁ֗ישׁ (H8658, HNcmsa) se representa ahora con «como berilo»:
    la preposición כְּ con «como» y el sustantivo con «berilo». Se elimina «piedra»,
    que no tenía contrapartida en el hebreo y que sostenía una transliteración («Tarsis»)
    que en español remite al topónimo H8659, un referente falso para este lemma. Los
    17 tokens del versículo siguen representados; el resto de la cláusula no se modifica.
    Verificado que «como berilo» → «como piedra de Tarsis» reproduce exactamente el
    texto aprobado anterior. La decisión, su alcance (Occurrence, Daniel 10:6), la
    confianza (Media) y la disputa léxica subyacente quedan documentadas en investigations/daniel/INV-27-0003.'
  notes: 'Decisión aprobada por el humano y registrada en investigations/daniel/INV-27-0003
    conforme a WORKFLOW.md §8 y DECISION_SCOPE.md; edición registrada en workflow/daniel/lexical-edits.jsonl
    con scope «Single Reference». Confianza Media de forma deliberada: la identificación
    de H8658 está dividida en la tradición léxica (berilo / crisólito / topacio /
    jaspe amarillo) y una edición futura puede reconsiderarla. Con esto quedan cerradas
    las tres observaciones abiertas sobre Daniel 10:6 (H5178, H1995, H8658). Pendiente
    para G0B: los char spans de este versículo.'
