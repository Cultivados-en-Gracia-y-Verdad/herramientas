- id: G0A-0001
  reference: Daniel 2:39
  decision: APPROVED
  confidence: high
  evidence: 'Los 17 tokens del span están representados sin omisión ni adición: וּ/בָתְרָ/ךְ
    «Y después de ti»; תְּקוּם «se levantará»; מַלְכוּ + אָחֳרִי «otro reino»; el
    par ketiv/qere ארע/א ~ אֲרַע con מִנָּ/ךְ «menor que tú»; וּ/מַלְכוּ con el par
    ketiv/qere תליתיא ~ תְלִיתָאָה y אָחֳרִי «y otro tercer reino»; דִּי + נְחָשָׁ/א
    «de bronce»; דִּי + תִשְׁלַט «el cual se enseñoreará»; בְּ/כָל + אַרְעָ/א «de
    toda la tierra». La corrección «metal» → «bronce» representa נְחָשָׁ/א (H5174)
    por su valor léxico en lugar de la generalización tradicional heredada de RV1909;
    el resto de la cláusula es idéntico al estado ya aprobado el 2026-08-09. No se
    añade material sin apoyo, no se omite ningún token, no se distorsiona ninguna
    relación gramatical, y no se resuelve ninguna ambigüedad que el arameo deje abierta.'
  notes: 'Hallazgo derivado para la revisión final del libro (no bloquea este ítem):
    H5174 sigue traducido «metal» en Daniel 2:32, 2:35, 2:45, 5:4, 5:23 y 7:19. Las
    tres primeras describen la misma estatua de este mismo discurso, de modo que 2:39
    es ahora el único lugar del libro donde el lemma se traduce «bronce». Requiere
    una decisión de consistencia a nivel de libro (WORKFLOW.md §17); si esa decisión
    cambia esos versículos, cada uno vuelve a G0A. Nota aparte para G0B: el cambio
    de longitud de la frase (125→126 caracteres) invalida el char span de la unidad
    59:0 en daniel-reverse-links.json.'
