  - reference: Daniel 9:11
    unitId: '261:0'
    surface: 'Y todo Israel traspasó tu ley apartándose para no oir tu voz: por lo
      cual ha fluido sobre nosotros la maldición, y el juramento que está escrito
      en la ley de Moisés, siervo de Dios; porque contra él pecamos.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:12
    unitId: '262:0'
    surface: Y él ha verificado su palabra que habló sobre nosotros, y sobre nuestros
      jueces que nos gobernaron, trayendo sobre nosotros tan grande mal; que nunca
      fue hecho debajo del cielo como el que fue hecho en Jerusalén.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:13
    unitId: '263:0'
    surface: 'Según está escrito en la ley de Moisés, todo aqueste mal vino sobre
      nosotros: y no hemos rogado a la faz de Jehová nuestro Dios, para convertirnos
      de nuestras maldades, y entender tu verdad.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:14
    unitId: '264:0'
    surface: Veló por tanto Jehová sobre el mal, y lo trajo sobre nosotros; porque
      justo es Jehová nuestro Dios en todas sus obras que hizo, porque no obedecimos
      a su voz.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:15
    unitId: '265:0'
    surface: Ahora pues, Señor Dios nuestro, que sacaste tu pueblo de la tierra de
      Egipto con mano poderosa, y te hiciste nombre cual en este día; hemos pecado,
      impíamente hemos hecho.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:16
    unitId: '266:0'
    surface: 'Oh Señor, según todas tus justicias, se aparte ahora tu ira y tu furor
      de sobre tu ciudad Jerusalén, tu santo monte: porque a causa de nuestros pecados,
      y por la maldad de nuestros padres, Jerusalén y tu pueblo dados son en oprobio
      a todos en derredor nuestro.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:17
    unitId: '267:0'
    surface: Ahora pues, Dios nuestro, oye la oración de tu siervo, y sus ruegos,
      y haz que tu rostro resplandezca sobre tu santuario asolado, por amor del Señor.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:18
    unitId: '268:0'
    surface: 'Inclina, oh Dios mío, tu oído, y oye; abre tus ojos, y mira nuestros
      asolamientos, y la ciudad sobre la cual es llamado tu nombre: porque no derramamos
      nuestros ruegos ante tu acatamiento confiados en nuestras justicias, sino en
      tus muchas miseraciones.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:19
    unitId: '269:0'
    surface: 'Oye, Señor; oh Señor, perdona; presta oído, Señor, y haz; no pongas
      dilación, por amor de ti mismo, Dios mío: porque tu nombre es llamado sobre
      tu ciudad y sobre tu pueblo.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:20
    unitId: '270:0'
    surface: Aun estaba hablando, y orando, y confesando mi pecado y el pecado de
