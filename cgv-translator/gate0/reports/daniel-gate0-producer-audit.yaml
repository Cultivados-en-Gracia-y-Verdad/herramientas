    unitId: '120:0'
    surface: Y cuya copa era hermosa, y su fruto en abundancia, y que para todos había
      mantenimiento en él; debajo del cual moraban las bestias del campo, y en sus
      ramas habitaban las aves del cielo,
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:22
    unitId: '121:0'
    surface: Tú mismo eres, oh rey, que creciste, y te hiciste fuerte, pues creció
      tu grandeza, y ha llegado hasta el cielo, y tu señorío hasta el cabo de la tierra.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:23
    unitId: '122:0'
    surface: 'Y cuanto a lo que vio el rey, un vigilante y santo que descendía del
      cielo, y decía: Cortad el árbol y destruidlo: mas la cepa de sus raíces dejaréis
      en la tierra, y con atadura de hierro y de metal en la hierba del campo; y sea
      mojado con el rocío del cielo, y su parte sea con las bestias del campo, hasta
      que pasen sobre él siete tiempos:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:24
    unitId: '123:0'
    surface: 'Esta es la interpretación, oh rey, y la sentencia del Altísimo, que
      ha venido sobre el rey mi señor:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:25
    unitId: '124:0'
    surface: Que te echarán de entre los hombres, y con las bestias del campo será
      tu morada, y con hierba del campo te apacentarán como a los bueyes, y con rocío
      del cielo serás bañado; y siete tiempos pasarán sobre ti, hasta que entiendas
      que el Altísimo se enseñorea en el reino de los hombres, y que a quien él quisiera
      lo dará.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:26
    unitId: '125:0'
    surface: Y lo que dijeron, que dejasen en la tierra la cepa de las raíces del
      mismo árbol, significa que tu reino se te quedará firme, luego que entiendas
      que el señorío es en los cielos.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:27
    unitId: '126:0'
    surface: Por tanto, oh rey, aprueba mi consejo, y rompe con tus pecados haciendo
      justicia, y con tus iniquidades mostrando misericordia para con los pobres;
