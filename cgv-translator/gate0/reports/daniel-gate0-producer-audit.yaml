  - reference: Daniel 2:27
    unitId: '47:0'
    surface: 'Daniel respondió delante del rey, y dijo: El misterio que el rey demanda,
      ni sabios, ni astrólogos, ni magos, ni adivinos lo pueden enseñar al rey.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:28
    unitId: '48:0'
    surface: 'Mas hay un Dios en los cielos, el cual revela los misterios, y él ha
      hecho saber al rey Nabucodonosor lo que ha de acontecer a cabo de días. Tu sueño,
      y las visiones de tu cabeza sobre tu cama, es esto:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:29
    unitId: '49:0'
    surface: Tú, oh rey, en tu cama subieron tus pensamientos por saber lo que había
      de ser en lo por venir; y el que revela los misterios te mostró lo que ha de
      ser.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:30
    unitId: '50:0'
    surface: Y a mí ha sido revelado este misterio, no por sabiduría que en mí haya
      más que en todos los vivientes, sino para que yo notifique al rey la interpretación,
      y que entendieses los pensamientos de tu corazón.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:31
    unitId: '51:0'
    surface: Tú, oh rey, veías, y he aquí una grande imagen. Esta imagen, que era
      muy grande, y cuya gloria era muy sublime, estaba en pie delante de ti, y su
      aspecto era terrible.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:32
    unitId: '52:0'
    surface: La cabeza de esta imagen era de fino oro; sus pechos y sus brazos, de
      plata; su vientre y sus muslos, de metal;
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:33
    unitId: '53:0'
    surface: Sus piernas de hierro; sus pies, en parte de hierro, y en parte de barro
      cocido.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:34
    unitId: '54:0'
    surface: Estabas mirando, hasta que una piedra fue cortada, no con mano, la cual
      hirió a la imagen en sus pies de hierro y de barro cocido, y los desmenuzó.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:35
    unitId: '55:0'
    surface: Entonces fue también desmenuzado el hierro, el barro cocido, el metal,
      la plata y el oro, y se tornaron como tamo de las eras del verano; y los levantó
      el viento, y nunca más se les halló lugar. Mas la piedra que hirió a la imagen
      fue hecha un gran monte, que hinchió toda la tierra.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:36
    unitId: '56:0'
    surface: 'Este es el sueño: la interpretación de él diremos también en presencia
      del rey.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:37
    unitId: '57:0'
    surface: Tú, oh rey, eres rey de reyes; porque el Dios del cielo te ha dado reino,
      potencia, y fortaleza, y majestad.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:38
    unitId: '58:0'
    surface: 'Y dondequiera que habitan los hijos de los hombres, las bestias del
      campo y las aves del cielo, él los ha entregado en tu mano y te ha hecho enseñorear
      sobre todos ellos: tú eres aquella cabeza de oro.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:39
    unitId: '59:0'
    surface: Y después de ti se levantará otro reino menor que tú; y otro tercer reino
      de metal, el cual se enseñoreará de toda la tierra.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:40
    unitId: '60:0'
    surface: Y el reino cuarto será fuerte como hierro; y como el hierro desmenuza
      y doma todas las cosas, y como el hierro que quebranta todas estas cosas, desmenuzará
      y quebrantará.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:41
    unitId: '61:0'
    surface: Y lo que viste de los pies y los dedos, en parte de barro cocido de alfarero,
      y en parte de hierro, el reino será dividido; mas habrá en él algo de fortaleza
      de hierro, según que viste el hierro mezclado con el tiesto de barro.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:42
    unitId: '62:0'
    surface: Y por ser los dedos de los pies en parte de hierro, y en parte de barro
      cocido, en parte será el reino fuerte, y en parte será frágil.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:43
    unitId: '63:0'
    surface: Cuanto a aquello que viste, el hierro mezclado con tiesto de barro, se
      mezclaran con simiente humana, mas no se pegarán el uno con el otro, como el
      hierro no se mistura con el tiesto.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:44
    unitId: '64:0'
    surface: Y en los días de estos reyes, el Dios del cielo levantará un reino que
      nunca será destruido; y este reino no será dejado a otro pueblo. Desmenuzará
      y consumirá todos estos reinos, y él permanecerá para siempre.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:45
    unitId: '65:0'
    surface: 'De la manera que viste que del monte fue cortada una piedra, no con
      manos, la cual desmenuzó al hierro, al metal, al tiesto, a la plata, y al oro;
      el gran Dios ha mostrado al rey lo que ha de acontecer en lo por venir: y el
      sueño es verdadero, y fiel su interpretación.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:46
    unitId: '66:0'
    surface: Entonces el rey Nabucodonosor cayó sobre su rostro y se postró ante Daniel,
      y mandó que le ofrecieran ofrenda e incienso.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:47
    unitId: '67:0'
    surface: 'El rey habló a Daniel, y dijo: Ciertamente que el Dios vuestro es Dios
      de dioses, y el Señor de los reyes, y el descubridor de los misterios, pues
      pudiste revelar este secreto.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 2:48
    unitId: '68:0'
    surface: Entonces el rey engrandeció a Daniel, y le dió muchos y grandes dones,
      y lo puso por gobernador de toda la provincia de Babel, y por príncipe de los
      gobernadores sobre todos los sabios de Babel.
