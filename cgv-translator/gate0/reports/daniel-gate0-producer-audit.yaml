  - reference: Daniel 3:1
    unitId: '70:0'
    surface: 'El rey Nabucodonosor hizo una imagen de oro, la altura de la cual era
      de sesenta codos, su anchura de seis codos: la levanto en el campo de Dura,
      en la provincia de Babel.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:2
    unitId: '71:0'
    surface: Y envió el rey Nabucodonosor a juntar los grandes, los asistentes y capitanes,
      oidores, receptores, los del consejo, presidentes, y a todos los gobernadores
      de las provincias, para que vinieran a la dedicación de la imagen que el rey
      Nabucodonosor había levantado.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:3
    unitId: '72:0'
    surface: 'Fueron pues reunidos los grandes, los asistentes y capitanes, los oidores,
      receptores, los del consejo, los presidentes, y todos los gobernadores de las
      provincias, a la dedicación de la imagen que el rey Nabucodonosor había levantado:
      y estaban en pie delante de la imagen que había levantado el rey Nabucodonosor.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:4
    unitId: '73:0'
    surface: 'Y el pregonero pregonaba en alta voz: Se manda a vosotros, oh pueblos,
      naciones y lenguas:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:5
    unitId: '74:0'
    surface: 'Al oír el sonido del cuerno, de la flauta, de la cítara, del arpa, del
      salterio, de la zampoña y de todo género de música, os postraréis y adoraréis
      la imagen de oro que el rey Nabucodonosor ha levantado:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:6
    unitId: '75:0'
    surface: Y cualquiera que no se postrare y adorara, en la misma hora será echado
      dentro de un horno de fuego ardiendo.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:7
    unitId: '76:0'
    surface: Por lo cual, al oír todos los pueblos el sonido del cuerno, de la flauta,
      de la cítara, del arpa, del salterio, de la zampoña y de todo género de música,
      todos los pueblos, naciones, y lenguas, se postraron, y adoraron la imagen de
      oro que el rey Nabucodonosor había levantado.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:8
    unitId: '77:0'
    surface: Por esto, en aquel mismo tiempo, algunos varones caldeos se acercaron
      y acusaron a los judíos.
