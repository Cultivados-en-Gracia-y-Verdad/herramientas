    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:33
    unitId: '132:0'
    surface: En la misma hora se cumplió la palabra sobre Nabucodonosor, y fue echado
      de entre los hombres; y comía hierba como los bueyes, y su cuerpo se bañaba
      con el rocío del cielo, hasta que su pelo creció como de águila, y sus uñas
      como de aves.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:34
    unitId: '133:0'
    surface: Mas al fin del tiempo yo Nabucodonosor alcé mis ojos al cielo, y mi sentido
      me fue vuelto; y bendije al Altísimo, y alabé y glorifiqué al que vive para
      siempre; porque su señorío es sempiterno, y su reino por todas las edades.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:35
    unitId: '134:0'
    surface: 'Y todos los moradores de la tierra por nada son contados: y en el ejército
      del cielo, y en los habitantes de la tierra, hace según su voluntad: ni hay
      quien estorbe su mano, y le diga: ¿Qué haces?'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:36
    unitId: '135:0'
    surface: En el mismo tiempo mi sentido me fue vuelto, y la majestad de mi reino,
      mi dignidad y mi grandeza volvieron a mí, y mis gobernadores y mis grandes me
      buscaron; y fuí restituido a mi reino, y mayor grandeza me fue añadida.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 4:37
    unitId: '136:0'
    surface: Ahora yo Nabucodonosor alabo, engrandezco y glorifico al Rey del cielo,
      porque todas sus obras son verdad, y sus caminos juicio; y humillar puede a
      los que andan con soberbia.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:1
    unitId: '137:0'
