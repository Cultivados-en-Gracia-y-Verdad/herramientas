    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:24
    unitId: '93:0'
    surface: 'Entonces el rey Nabucodonosor se espantó, y se levantó apriesa, y habló,
      y dijo a los de su consejo: ¿No echaron tres varones atados dentro del fuego?
      Ellos respondieron y dijeron al rey: Es verdad, oh rey.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:25
    unitId: '94:0'
    surface: 'Respondió él y dijo: He aquí que yo veo cuatro varones sueltos, que
      se pasean en medio del fuego, y ningún daño hay en ellos: y el aspecto del cuarto
      es semejante a un hijo de los dioses.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:26
    unitId: '95:0'
    surface: 'Entonces Nabucodonosor se acercó a la puerta del horno de fuego ardiendo,
      y habló y dijo: Sadrac, Mesac, y Abed-nego, siervos del Dios Altísimo, salid
      y venid. Entonces Sadrac, Mesac, y Abed-nego, salieron de en medio del fuego.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:27
    unitId: '96:0'
    surface: Y se juntaron los grandes, los gobernadores, los capitanes, y los del
      consejo del rey, para mirar estos varones, como el fuego no se enseñoreó de
      sus cuerpos, ni cabello de sus cabezas fue quemado, ni sus ropas se mudaron,
      ni olor de fuego había pasado por ellos.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:28
    unitId: '97:0'
    surface: 'Nabucodonosor habló y dijo: Bendito el Dios de ellos, de Sadrac, Mesac,
      y Abed-nego, que envió su ángel, y libró sus siervos que esperaron en él, y
      quebrantaron el mandamiento del rey, y entregaron sus cuerpos antes que sirviesen
      ni adoraran otro dios que su Dios.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 3:29
    unitId: '98:0'
    surface: Por mí pues se pone decreto, que todo pueblo, nación, o lengua, que dijera
      blasfemia contra el Dios de Sadrac, Mesac, y Abed-nego, sea descuartizado, y
      su casa sea puesta por muladar; por cuanto no hay dios que pueda librar como
      éste.
    status: gloss-seed
    method: verse-span-resynchronization
