    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:21
    unitId: '188:0'
    surface: 'Entonces habló Daniel con el rey: oh rey, para siempre vive.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:22
    unitId: '189:0'
    surface: 'El Dios mío envió su ángel, el cual cerró la boca de los leones, para
