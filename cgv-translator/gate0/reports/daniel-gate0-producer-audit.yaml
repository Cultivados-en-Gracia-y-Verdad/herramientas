  - reference: Daniel 5:5
    unitId: '141:0'
    surface: En aquella misma hora salieron unos dedos de mano de hombre, y escribían
      delante del candelero sobre lo encalado de la pared del palacio real, y el rey
      veía la palma de la mano que escribía.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:6
    unitId: '142:0'
    surface: Entonces el rey se demudó de su color, y sus pensamientos lo turbaron,
      y se desataron las ceñiduras de sus lomos, y sus rodillas se batían la una con
      la otra.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:7
    unitId: '143:0'
    surface: 'El rey clamó en alta voz que hicieran venir magos, caldeos, y adivinos.
      Habló el rey, y dijo a los sabios de Babel: Cualquiera que leyere esta escritura,
      y me mostrare su interpretación, será vestido de púrpura, y tendrá collar de
      oro a su cuello; y en el reino se enseñoreará el tercero.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:8
    unitId: '144:0'
    surface: Entonces fueron introducidos todos los sabios del rey, y no pudieron
      leer la escritura, ni mostrar al rey su interpretación.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:9
    unitId: '145:0'
    surface: Entonces el rey Belsasar fue muy turbado, y se le mudaron sus colores
      y se alteraron sus príncipes.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:10
    unitId: '146:0'
    surface: 'La reina, por las palabras del rey y de sus príncipes, entró a la sala
      del banquete. Y habló la reina, y dijo: Rey, para siempre vive, no te asombren
      tus pensamientos, ni tus colores se demuden:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:11
    unitId: '147:0'
    surface: 'En tu reino hay un varón, en el cual mora el espíritu de los dioses
      santos; y en los días de tu padre se halló en él luz e inteligencia y sabiduría,
      como ciencia de los dioses: al cual el rey Nabucodonosor, tu padre, el rey tu
      padre constituyó príncipe sobre todos los magos, astrólogos, caldeos, y adivinos:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:12
    unitId: '148:0'
    surface: Por cuanto fue hallado en él mayor espíritu, y ciencia, y entendimiento,
      interpretando sueños, y declarando preguntas, y deshaciendo dudas, es a saber,
      en Daniel; al cual el rey puso por nombre Beltsasar. Llámese pues ahora a Daniel,
      y él mostrará la interpretación.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:13
    unitId: '149:0'
    surface: 'Entonces Daniel fue traído delante del rey. Y habló el rey, y dijo a
      Daniel: ¿Eres tú aquel Daniel de los hijos de la cautividad de Judá, que mi
      padre trajo de Judea?'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:14
    unitId: '150:0'
    surface: Yo he oído de ti que el espíritu de los dioses santos está en ti, y que
      en ti se halló luz, y entendimiento y mayor sabiduría.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:15
    unitId: '151:0'
    surface: 'Y ahora fueron traídos delante de mí sabios, astrólogos, que leyesen
      esta escritura, y me mostrasen su interpretación: pero no han podido mostrar
      la interpretación del negocio.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:16
    unitId: '152:0'
    surface: Yo pues he oído de ti que puedes declarar las dudas, y desatar dificultades.
      Si ahora pudieres leer esta escritura, y mostrarme su interpretación, serás
      vestido de púrpura, y collar de oro tendrás en tu cuello, y en el reino serás
      el tercer señor.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:17
    unitId: '153:0'
    surface: 'Entonces Daniel respondió, y dijo delante del rey: Tus dones sean para
      ti, y tus presentes dalos a otro. La escritura yo la leeré al rey, y le mostraré
      la interpretación.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:18
    unitId: '154:0'
    surface: 'El altísimo Dios, oh rey, dió a Nabucodonosor tu padre el reino, y la
      grandeza, y la gloria, y la honra:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:19
    unitId: '155:0'
    surface: 'Y por la grandeza que le dió, todos los pueblos, naciones, y lenguas,
      temblaban y temían delante de él. Los que él quería mataba, y daba vida a los
      que quería: engrandecía a los que quería, y a los que quería humillaba.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:20
    unitId: '156:0'
    surface: 'Mas cuando su corazón se ensoberbeció, y su espíritu se endureció en
      altivez, fue depuesto del trono de su reino, y quitaron de él la gloria:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:21
    unitId: '157:0'
    surface: Y fue echado de entre los hijos de los hombres; y su corazón fue puesto
      con las bestias, y con los asnos monteses fue su morada. Hierba le hicieron
      comer, como a buey, y su cuerpo fue bañado con el rocío del cielo, hasta que
      conoció que el altísimo Dios se enseñorea del reino de los hombres, y que pondrá
      sobre él al que quisiera.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:22
    unitId: '158:0'
    surface: 'Y tú, su hijo Belsasar, no has humillado tu corazón, sabiendo todo esto:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 5:23
    unitId: '159:0'
    surface: 'Antes contra el Señor del cielo te has ensoberbecido, e hiciste traer
      delante de ti los vasos de su casa, y tú y tus príncipes, tus mujeres y tus
      concubinas, bebisteis vino en ellos: demás de esto, a dioses de plata y de oro,
      de metal, de hierro, de madera, y de piedra, que ni ven, ni oyen, ni saben,
