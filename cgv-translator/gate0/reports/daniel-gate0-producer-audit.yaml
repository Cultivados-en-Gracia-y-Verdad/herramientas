    unitId: '313:0'
    surface: Vendrá pues el rey del norte, y fundará baluartes, y tomará la ciudad
      fuerte; y los brazos del mediodía no podrán permanecer, ni su pueblo escogido,
      ni habrá fortaleza que pueda resistir.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 11:16
    unitId: '314:0'
    surface: Y el que vendrá contra él, hará a su voluntad, ni habrá quien se le pueda
