  - reference: Daniel 10:11
    unitId: '288:0'
    surface: 'Y me dijo: Daniel, varón de deseos, está atento a las palabras que te
      hablaré, y levántate sobre tus pies; porque a ti he sido enviado ahora. Y estando
      hablando conmigo esto, yo estaba temblando.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:12
    unitId: '289:0'
    surface: 'Y me dijo: Daniel, no temas: porque desde el primer día que diste tu
      corazón a entender, y a afligirte en la presencia de tu Dios, fueron oídas tus
      palabras; y a causa de tus palabras yo soy venido.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:13
    unitId: '290:0'
    surface: 'Mas el príncipe del reino de Persia se puso contra mí veintiún días:
      y he aquí, Miguel, uno de los principales príncipes, vino para ayudarme, y yo
      quedé allí con los reyes de Persia.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:14
    unitId: '291:0'
    surface: Soy pues venido para hacerte saber lo que ha de venir a tu pueblo en
      los postreros días; porque la visión es aún para días.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:15
    unitId: '292:0'
    surface: Y estando hablando conmigo semejantes palabras, puse mis ojos en tierra,
      y enmudecí.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:16
    unitId: '293:0'
    surface: 'Mas he aquí, como una semejanza de hijo de hombre tocó mis labios. Entonces
      abrí mi boca, y hablé, y dije a aquel que estaba delante de mí: Señor mío, con
      la visión se revolvieron mis dolores sobre mí, y no me quedó fuerza.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:17
    unitId: '294:0'
    surface: ¿Cómo pues podrá el siervo de mi señor hablar con este mi señor? porque
      al instante me faltó la fuerza, y no me ha quedado aliento.
