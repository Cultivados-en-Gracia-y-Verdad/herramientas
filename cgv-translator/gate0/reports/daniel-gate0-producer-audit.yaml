  - reference: Daniel 7:1
    unitId: '196:0'
    surface: 'En el primer año de Belsasar rey de Babel, vio Daniel un sueño y visiones
      de su cabeza en su cama: luego escribió el sueño, y notó la suma de los negocios.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:2
    unitId: '197:0'
    surface: 'Habló Daniel y dijo: Veía yo en mi visión de noche, y he aquí que los
      cuatro vientos del cielo combatían en la gran mar.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:3
    unitId: '198:0'
    surface: Y cuatro bestias grandes, diferentes la una de la otra, subían de la
      mar.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:4
    unitId: '199:0'
    surface: La primera era como león, y tenía alas de águila. Yo estaba mirando hasta
      tanto que sus alas fueron arrancadas, y fue levantada de la tierra; y se puso
      enhiesta sobre los pies a manera de hombre, y le fue dado corazón de hombre.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:5
    unitId: '200:0'
    surface: 'Y he aquí otra segunda bestia, semejante a un oso, la cual se puso al
      un lado, y tenía en su boca tres costillas entre sus dientes; y le fue dicho
      así: Levántate, traga carne mucha.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:6
    unitId: '201:0'
    surface: 'Después de esto yo miraba, y he aquí otra, semejante a un leopardo,
      y tenía cuatro alas de ave en sus espaldas: tenía también esta bestia cuatro
      cabezas; y le fue dada potestad.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:7
    unitId: '202:0'
    surface: 'Después de esto miraba yo en las visiones de la noche, y he aquí la
      cuarta bestia, espantosa y terrible, y en grande manera fuerte; la cual tenía
      unos dientes grandes de hierro: devoraba y desmenuzaba, y las sobras hollaba
      con sus pies: y era muy diferente de todas las bestias que habían sido antes
      de ella, y tenía diez cuernos.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 7:8
    unitId: '203:0'
    surface: Estando yo contemplando los cuernos, he aquí que otro cuerno pequeño
