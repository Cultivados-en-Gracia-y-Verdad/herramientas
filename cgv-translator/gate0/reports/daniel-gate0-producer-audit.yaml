  - reference: Daniel 6:12
    unitId: '179:0'
    surface: 'Se llegaron luego, y hablaron delante del rey acerca del edicto real:
      ¿No has confirmado edicto que cualquiera que pidiere a cualquier dios ú hombre
      en el espacio de treinta días, excepto a ti, oh rey, fuera echado en el foso
      de los leones? Respondió el rey y dijo: Verdad es, conforme a la ley de Media
      y de Persia, la cual no se abroga.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:13
    unitId: '180:0'
    surface: 'Entonces respondieron y dijeron delante del rey: Daniel que es de los
      hijos de la cautividad de Judá, no ha hecho cuenta de ti, oh rey, ni del edicto
      que confirmaste; antes tres veces al día hace su petición.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:14
    unitId: '181:0'
    surface: El rey entonces, oyendo el negocio, le peso en gran manera, y sobre Daniel
      puso cuidado para librarlo; y hasta puestas del sol trabajó para librarle.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:15
    unitId: '182:0'
    surface: 'Empero aquellos hombres se reunieron cerca del rey, y dijeron al rey:
      Sepas, oh rey, que es ley de Media y de Persia, que ningún decreto ú ordenanza
      que el rey confirmare pueda mudarse.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:16
    unitId: '183:0'
    surface: 'Entonces el rey mandó, y trajeron a Daniel, y le echaron en el foso
      de los leones. Y hablando el rey dijo a Daniel: El Dios tuyo, a quien tú continuamente
      sirves, él te libre.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:17
    unitId: '184:0'
    surface: Y fue traída una piedra, y puesta sobre la puerta del foso, la cual selló
      el rey con su anillo, y con el anillo de sus príncipes, porque el acuerdo acerca
      de Daniel no se mudase.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:18
    unitId: '185:0'
    surface: Se fue luego el rey a su palacio, y se acostó ayuno; ni instrumentos
      de música fueron traídos delante de él, y se le fue el sueño.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:19
    unitId: '186:0'
    surface: 'El rey, por tanto, se levantó muy de mañana, y fue apriesa al foso de
      los leones:'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 6:20
    unitId: '187:0'
    surface: 'Y se llegando cerca del foso llamó a voces a Daniel con voz triste:
      y hablando el rey dijo a Daniel: Daniel, siervo del Dios viviente, el Dios tuyo,
