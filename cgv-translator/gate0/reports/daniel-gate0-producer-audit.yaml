    unitId: '272:0'
    surface: 'Y me hizo entender, y habló conmigo, y dijo: Daniel, ahora he salido
      para hacerte entender la interpretación.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:23
    unitId: '273:0'
    surface: Al principio de tus ruegos salió la palabra, y yo he venido para enseñártela,
      porque tú eres varón de deseos. Entiende pues la palabra, y entiende la visión.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:24
    unitId: '274:0'
    surface: Setenta semanas están determinadas sobre tu pueblo y sobre tu santa ciudad,
      para acabar la prevaricación, y concluir el pecado, y expiar la iniquidad; y
      para traer la justicia de los siglos, y sellar la visión y la profecía, y ungir
      al Santo de los santos.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:25
    unitId: '275:0'
    surface: Sepas pues y entiendas, que desde la salida de la palabra para restaurar
      y edificar a Jerusalén hasta el Mesías Príncipe, habrá siete semanas, y sesenta
      y dos semanas; se tornara a edificar la plaza y el muro en tiempos angustiosos.
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:26
    unitId: '276:0'
    surface: 'Y después de las sesenta y dos semanas se quitará la vida al Mesías,
      y nada tendrá: y el pueblo de un príncipe que ha de venir, destruirá a la ciudad
      y el santuario; con inundación será el fin de ella, y hasta el fin de la guerra
      será talada con asolamientos.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 9:27
    unitId: '277:0'
    surface: 'Y en otra semana confirmará el pacto a muchos, y a la mitad de la semana
      hará cesar el sacrificio y la ofrenda: y sobre el ala de abominaciones vendrá
      uno que desola, hasta que la consumación determinada se derrame sobre el desolador.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:1
    unitId: '278:0'
    surface: 'En el tercer año de Ciro rey de Persia, fue revelada palabra a Daniel,
      cuyo nombre era Beltsasar; y la palabra era verdadera, y el conflicto era grande:
      él empero comprendió la palabra, y tuvo inteligencia en la visión.'
    status: gloss-seed
    method: verse-span-resynchronization
  - reference: Daniel 10:2
