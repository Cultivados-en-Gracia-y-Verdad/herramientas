    frase española resuelve esa cuestión en una dirección sin que la evidencia del
    paquete permita certificarla.
  notes: Requiere especialista de arameo y una decisión documentada de política LBF.
    La misma decisión debe aplicarse coherentemente a Daniel 2:8 y al contexto inmediato.
