  reference: Daniel 3:15
  mt_reference: Daniel 3:15
  spanish: 'Ahora pues, ¿estáis prestos para que al oír el sonido del cuerno, de la
    flauta, de la cítara, del arpa, del salterio, de la zampoña y de todo género de
    música, os postréis, y adoréis la imagen que he hecho? Porque si no la adoréis,
    en la misma hora seréis echados en medio de un horno de fuego ardiendo: ¿y qué
    dios será aquel que os libre de mis manos?'
