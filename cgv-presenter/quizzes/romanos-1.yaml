quizzes:
  - id: romanos-1-tesis
    title: "Romanos 1 - Tesis del evangelio"
    question: "Segun Romanos 1:16, que es el evangelio?"
    choices:
      - "Un metodo religioso"
      - "Poder de Dios para salvacion"
      - "Una tecnica de cambio moral"
      - "Una tradicion romana"

  - id: romanos-1-promesa
    title: "Romanos 1 - Promesa"
    question: "Como presenta Pablo el evangelio al inicio de Romanos?"
    choices:
      - "Como algo prometido antes por Dios"
      - "Como una idea nueva de Pablo"
      - "Como una ley civil"
      - "Como una costumbre local"
