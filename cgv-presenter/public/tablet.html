<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tablet Drawing</title>
  <link rel="icon" href="/assets/cgv-app-icon.svg">
  <link rel="stylesheet" href="styles.css?v=1.2.4-flowchart-branches">
  <link rel="stylesheet" href="style-settings.css?v=editorial-folio-4">
  <link rel="stylesheet" href="tablet.css">
</head>
<body class="tablet">
  <div class="tablet-toolbar" id="tabletToolbar">
    <div class="tablet-title">Tablet Drawing</div>
    <div class="tablet-actions">
      <button id="tabletPrevButton" type="button">Previous</button>
      <button id="tabletNextButton" type="button">Next</button>
      <button id="tabletBlankButton" type="button">Blank</button>
      <button id="tabletFullscreenButton" type="button">Fullscreen</button>
      <button id="tabletClearButton" type="button">Clear</button>
    </div>
  </div>

  <button id="tabletFullscreenBlankButton" type="button" aria-label="Toggle blank screen">Blank</button>
  <button id="tabletExitFullscreenButton" type="button" aria-label="Exit fullscreen">Exit</button>

  <div class="tablet-stage" id="tabletStage">
    <div class="tablet-surface" id="tabletSurface">
      <img id="tabletProjectorFeed" alt="Projector feed" draggable="false">
      <div id="tabletBlankSurface" aria-hidden="true"></div>
      <canvas id="tabletDrawingCanvas"></canvas>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js?v=1.2.4-flowchart-branches"></script>
  <script src="tablet.js"></script>
</body>
</html>
