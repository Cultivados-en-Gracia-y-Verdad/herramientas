<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="presenter">Presenter</title>
  <link rel="icon" href="/assets/cgv-app-icon.png">
  <link rel="stylesheet" href="styles.css?v=1.2.7">
  <link rel="stylesheet" href="style-settings.css?v=editorial-folio-4">
</head>
<body class="presenter">
  <div class="topbar">
    <div class="app-brand">
      <img src="/assets/cgv-logo.svg" alt="CGV">
      <div>
        <strong>CGV Presenter</strong>
        <span data-i18n="presenterView">Presenter View</span>
      </div>
    </div>
    <div class="presenter-tools">
      <label class="section-select-label">
        <span data-i18n="courseSections">Course Sections</span>
        <select id="presenterSectionSelect"></select>
      </label>
      <button onclick="reloadSlides()" data-i18n="reloadSlides">Reload Slides</button>
    </div>
  </div>

  <main class="grid">
    <section>
      <h2 data-i18n="current">Current</h2>
      <div id="current" class="slide"></div>
    </section>

    <section>
      <h2 data-i18n="next">Next</h2>
      <div id="next" class="slide next"></div>
    </section>
  </main>

  <footer>
    <button onclick="prev()">← <span data-i18n="previous">Prev</span></button>
    <button onclick="next()"><span data-i18n="next">Next</span> →</button>
  </footer>
  <div id="sharedPopupOverlay" class="shared-popup-overlay"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js?v=1.2.9"></script>
</body>
</html>
