<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="audience">Audience</title>
  <link rel="icon" href="/assets/cgv-app-icon.png">
  <link rel="stylesheet" href="styles.css?v=1.2.6">
  <link rel="stylesheet" href="style-settings.css?v=editorial-folio-4">
</head>
<body class="audience">
  <div id="joinGreeting" class="join-greeting"></div>
  <div class="audience-stage">
    <form id="joinForm" class="join-panel" onsubmit="joinSession(event)">
      <label for="participantName" data-i18n="nameOrCode">Name or code</label>
      <div class="join-row">
        <input id="participantName" autocomplete="name" maxlength="80" required>
        <button type="submit" data-i18n="join">Join</button>
      </div>
    </form>

    <div id="audienceSlide" class="slide audience-slide"></div>
    <div id="quizArea" class="quiz-area"></div>
  </div>
  <div id="sharedPopupOverlay" class="shared-popup-overlay"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js?v=1.2.6"></script>
</body>
</html>
