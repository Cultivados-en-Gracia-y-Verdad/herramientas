<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGV Manager</title>
  <link rel="stylesheet" href="/styles.css?v=13">
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">CGV</span>
      <div><strong>Manager</strong><small>Manual production</small></div>
    </div>
    <div class="header-actions">
      <select id="course" aria-label="Course"></select>
      <button id="open-course" class="quiet">Open folder</button>
      <button id="refresh" class="quiet">Refresh</button>
    </div>
  </header>

  <main>
    <div id="notice" class="notice hidden" aria-live="polite"></div>

    <section class="course-heading">
      <div>
        <p id="course-folder" class="kicker"></p>
        <h1 id="course-title">Loading…</h1>
      </div>
      <div class="progress-wrap">
        <span id="progress-label"></span>
        <div class="progress-track"><span id="progress-bar"></span></div>
      </div>
    </section>

    <section class="operator-shell">
      <nav id="step-list" aria-label="Book workflow"></nav>

      <article class="work-panel">
        <div class="work-topline">
          <span id="step-number" class="step-number"></span>
          <span id="step-status" class="status"></span>
        </div>
        <p id="now-label" class="kicker">DO THIS NOW</p>
        <h2 id="step-title"></h2>
        <p id="step-detail" class="instruction"></p>
        <div id="step-note" class="evidence"></div>

        <div id="step-controls" class="controls"></div>

        <div id="decision" class="decision hidden">
          <label for="gate-notes">What you checked, who checked it, and the result</label>
          <textarea id="gate-notes" rows="3"></textarea>
          <div id="gate-actions" class="actions"></div>
        </div>

        <footer>
          <button id="previous-step" class="quiet">Previous</button>
          <button id="return-current" class="quiet hidden">Return to current task</button>
          <button id="next-step" class="quiet">Next</button>
        </footer>
      </article>
    </section>

    <section class="below">
      <details>
        <summary>Why work cannot move forward</summary>
        <div id="blockers" class="detail-body"></div>
      </details>
      <details>
        <summary>Recent activity</summary>
        <div id="provenance" class="detail-body"></div>
      </details>
    </section>
  </main>

  <script src="/app.js?v=13"></script>
</body>
</html>
